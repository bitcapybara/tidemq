# TideMQ Combined: one process with local durable execution and native Console HTTPS.
# From the repository root: tidemq validate-config --config config/combined.toml
# After provisioning: tidemq serve --config config/combined.toml
# Relative paths resolve from the process working directory, not this file.
# Lines prefixed "#? " are disabled optional examples. Enable a complete block
# only after supplying its required operational values.
# Single-host deployment has no node-level high availability.
# Use deploy/local/generate.sh rf3 for separated three-zone Raft replication.
#
# Required operational identity/topology: choose a unique nonzero node_id and
# a stable cluster UUID shared by all peers. The UUID below is a placeholder.
# Code defaults: node_id=1, cluster_id as below, data_dir="data/node-1".
# Role is required in a file; the in-memory default is combined.
node_id = 1
cluster_id = "00000000-0000-4000-8000-000000000001"
role = "combined"
# Loopback is required. Code default: 127.0.0.1:9419.
management_listen = "127.0.0.1:9419"
# Provision a writable private directory per node; never share it with peers.
data_dir = "data/node-1"

# Code defaults shared by all MQ roles; capacity admission preserves control work.
[memory]
total_bytes = 67108864
control_reserved_bytes = 4194304
max_connections = 128
max_streams_per_connection = 64
max_pending_requests = 256

[protocol]
max_frame_bytes = 1048576
max_control_frame_bytes = 16384
max_message_bytes = 262144
max_batch_messages = 1024
max_payload_fields = 1100
max_traceparent_bytes = 55

[logging]
filter = "warn,tidemq=info"
json = true
queue_events = 1024
max_event_bytes = 16384

# Code defaults. Optional OTLP export is disabled. Remote endpoints require HTTPS
# and a literal IP; the path must be /v1/traces. Never put credentials in the URL.
[tracing]
enabled = false
endpoint = "http://127.0.0.1:4318/v1/traces"
sample_per_mille = 10
spans_per_second = 128
queue_spans = 256
batch_spans = 32
export_interval_ms = 500
export_timeout_ms = 500

# Combined reuses this server identity for public QUIC and Console HTTPS.
# The certificate SAN must cover the host in console.session.public_origin.
# No internal mTLS trust root or peer certificate inventory is used.
[tls]
certificate = "certs/server.pem"
private_key = "certs/server-key.pem"

# Shared section required on every MQ role. The token file defaults to None.
# Only combined/metadata consumes it when authentication is uninitialized.
# Generate a private random token (32-256 printable ASCII characters) separately
# and store only that token in an owner-only file. No token value is shipped.
[authorization]
bootstrap_admin_token_file = "secrets/bootstrap.token"

# Combined/gateway only. Code default: 127.0.0.1:7443.
# For remote clients, configure a reachable address and matching TLS SANs.
[gateway]
listen = "127.0.0.1:7443"

# Combined/storage only. Omitted object storage defaults to disabled (None).
[storage]
archive_interval_ms = 1000

# Code defaults. Retention also respects protecting subscriptions and durable ACKs.
[storage.retention]
minimum_age_ms = 3600000
max_time_boundaries = 8192

# Optional object storage has no field defaults: all entries below are examples.
# Before enabling, set memory.total_bytes >= 201326592 and
# memory.control_reserved_bytes >= 33554432. Keep capacity.process_memory.high
# at least 67108864 bytes above memory.total_bytes (default high: 268435456).
# Provision the bucket and an owner-only credentials file separately. Its TOML is:
# access_key = "<replace-with-access-key>"
# secret_key = "<replace-with-secret-key>"
# Never place real credentials in this file or in the endpoint URL.
#? [storage.objects]
#? endpoint = "https://objects.example.test"
#? region = "replace-me"
#? bucket = "replace-me"
#? prefix = "replace-me"
#? credentials_file = "secrets/objects.toml"
#? allow_http_loopback = false

# Combined accepts logical group IDs only; ownership is derived from node_id.
# Replication, peers, voters, standby, internal_listen and bootstrap are rejected.
[runtime]
metadata_group = 1

[[runtime.groups]]
group_id = 2

# Shared code defaults: byte watermarks with low < high and a fresh sample.
[runtime.capacity]
max_sample_age_ms = 1000

[runtime.capacity.logical_backlog]
low = 100663296
high = 134217728

[runtime.capacity.physical_storage]
low = 201326592
high = 268435456

[runtime.capacity.shared_reclaim_lag]
low = 50331648
high = 67108864

[runtime.capacity.process_memory]
low = 201326592
high = 268435456

# Combined/metadata only. Omission defaults to None: automatic topic scaling is off.
# The timing and shard bounds below are code defaults. Capacity defaults are zero,
# which intentionally FAIL startup validation if enabled. Replace all eight zeros
# with a positive, measured capacity profile for one group at this deployment RF.
#? [runtime.topic_scaling]
#? sample_interval_ms = 10000
#? split_window_ms = 60000
#? merge_window_ms = 600000
#? cooldown_ms = 300000
#? high_per_mille = 700
#? low_per_mille = 300
#? min_shards = 1
#? max_shards = 128

#? [runtime.topic_scaling.capacity]
#? publish_bytes_per_second = 0
#? publish_messages_per_second = 0
#? delivery_bytes_per_second = 0
#? deliveries_per_second = 0
#? read_requests_per_second = 0
#? ack_bytes_per_second = 0
#? acknowledgements_per_second = 0
#? ack_requests_per_second = 0

# Required built-in HTTPS Console. It shares the process management listener.
[console]
listen = "127.0.0.1:8443"
static_dir = "console/web/dist"

[console.session]
# Provision exactly 32 random raw bytes with owner-only file access.
key_file = "secrets/console-session.key"
previous_key_files = []
public_origin = "https://localhost:8443"
max_age_seconds = 1800

[console.observability]
components = [
    #? { id = "prometheus-1", name = "Prometheus", probe_url = "http://127.0.0.1:9090/-/ready", detail_url = "https://metrics.example.test" },
]
#? alerts_url = "http://127.0.0.1:9090/api/v1/alerts"
#? alerts_detail_url = "https://metrics.example.test/alerts"
