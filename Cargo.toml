[package]
name = "tidemq"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A cloud-native message queue built on object storage, designed for high throughput, low latency, and elastic scaling."
license = "MIT"
repository = "https://github.com/bitcapybara/tidemq"
readme = "README.md"

[workspace]
members = [".", "crates/tidemq-protocol", "crates/tidemq-transport", "sdk/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/bitcapybara/tidemq"

[workspace.dependencies]
serde_json = "=1.0.154"
blake3 = "=1.8.7"
bytes = { version = "=1.12.1", features = ["serde"] }
getrandom = { version = "=0.4.3", features = ["std"] }
prost = "=0.14.4"
prometheus-client = "=0.25.1"
s2n-quic = { version = "=1.91.0", features = ["provider-tls-s2n", "provider-event-tracing"] }
s2n-quic-core = "=0.91.0"
serde = { version = "=1.0.229", features = ["derive"] }
snafu = "=0.9.2"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
tracing = "=0.1.44"
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
uuid = { version = "=1.28.0", features = ["serde"] }
tidemq-protocol = { path = "crates/tidemq-protocol", version = "0.1.0" }
tidemq-transport = { path = "crates/tidemq-transport", version = "0.1.0" }

[features]
default = ["allocator-mimalloc"]
allocator-system = []
allocator-mimalloc = ["dep:mimalloc"]
allocator-jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
heap-profiling = ["allocator-jemalloc", "tikv-jemalloc-ctl/profiling", "tikv-jemallocator/profiling", "tikv-jemallocator/profiling_libunwind"]
# Explicitly enabled only for deterministic runtime integration fault injection.
test-hooks = []

[[test]]
name = "runtime_reclamation"
required-features = ["test-hooks"]

[[test]]
name = "runtime_consumer_reads"
required-features = ["test-hooks"]

[[test]]
name = "runtime_consumer_close"
required-features = ["test-hooks"]

[[test]]
name = "runtime_group_watch"
required-features = ["test-hooks"]

[[test]]
name = "sdk_consumer_long_poll"
path = "sdk/rust/tests/runtime/consumer_long_poll.rs"
required-features = ["test-hooks"]

[[example]]
name = "deploy_validation"
path = "tests/deployment/driver.rs"

[dependencies]
anyhow = "=1.0.104"
async-trait = "=0.1.89"
aws-lc-rs = "=1.18.2"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "rustls"] }
blake3.workspace = true
base64 = "=0.23.1"
bytes.workspace = true
clap = { version = "=4.6.7", features = ["derive"] }
getrandom.workspace = true
http-body = "=1.1.0"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
libc = "=0.2.191"
mimalloc = { version = "=0.1.52", features = ["extended"], optional = true }
prometheus-client.workspace = true
prost.workspace = true
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
opentelemetry.workspace = true
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "http-proto"] }
opentelemetry-http = { version = "=0.33.1", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
webpki-root-certs = "=1.0.9"
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
s2n-quic.workspace = true
serde.workspace = true
serde_json = "=1.0.154"
snafu.workspace = true
subtle = "=2.6.1"
tidemq-protocol.workspace = true
tidemq-sdk = { path = "sdk/rust", default-features = false, features = ["opentelemetry"] }
tidemq-transport.workspace = true
tikv-jemallocator = { version = "=0.7.0", features = ["stats"], optional = true }
tikv-jemalloc-ctl = { version = "=0.7.0", features = ["stats", "use_std"], optional = true }
tokio.workspace = true
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-util.workspace = true
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["fs"] }
toml = "=1.1.8"
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid.workspace = true
zeroize = { version = "=1.9.1", features = ["serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
tidemq-sdk = { path = "sdk/rust", features = ["opentelemetry"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace"] }

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
