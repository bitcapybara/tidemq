x-runtime: &runtime
  image: ${TIDEMQ_IMAGE:?Set the verified local runtime image}
  pull_policy: never
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  cgroup: private
  pids_limit: 128
  cpus: 0.5
  mem_limit: 384m
  memswap_limit: 384m
  tmpfs: ["/tmp:rw,noexec,nosuid,size=16777216,mode=1777"]
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}
  restart: "no"
  stop_grace_period: 6s
services:
  network:
    <<: *runtime
    entrypoint: [/bin/sleep, infinity]
    cpus: 0.05
    mem_limit: 16m
    memswap_limit: 16m
    networks: [private, console-ingress]
    ports: ["127.0.0.1:8443:8443/tcp"]
  rustfs:
    <<: *runtime
    network_mode: service:network
    depends_on: {network: {condition: service_started}}
    cpus: 1
    mem_limit: ${TIDEMQ_RUSTFS_MEMORY:-512m}
    memswap_limit: ${TIDEMQ_RUSTFS_MEMORY:-512m}
    entrypoint: [/usr/local/bin/rustfs]
    command: [server, --address, "127.0.0.1:19000", --region, us-east-1, /var/lib/tidemq/objects]
    environment:
      RUSTFS_ACCESS_KEY_FILE: /run/rustfs/access.key
      RUSTFS_SECRET_KEY_FILE: /run/rustfs/secret.key
      RUSTFS_DURABILITY_MODE: strict
      RUSTFS_NEW_BUCKET_DURABILITY_MODE: inherit
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_ENDPOINT: ""
      RUSTFS_LOG_LEVEL: warn
      RUSTFS_LOG_DIRECTORY: /tmp/rustfs-logs
    volumes:
      - type: bind
        source: ${RUSTFS_BINARY:?Set the verified RustFS 1.0.3 executable path}
        target: /usr/local/bin/rustfs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./rustfs
        target: /run/rustfs
        read_only: true
        bind: {create_host_path: false}
      - rustfs-data:/var/lib/tidemq
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "1", "http://127.0.0.1:19000/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
  bucket:
    <<: *runtime
    network_mode: service:network
    depends_on: {rustfs: {condition: service_healthy}}
    cpus: 0.1
    mem_limit: 32m
    memswap_limit: 32m
    entrypoint: [/bin/bash, /run/scripts/init-bucket.sh]
    volumes:
      - type: bind
        source: ./rustfs
        target: /run/rustfs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./scripts/init-bucket.sh
        target: /run/scripts/init-bucket.sh
        read_only: true
        bind: {create_host_path: false}
  validator:
    <<: *runtime
    profiles: [tools]
    network_mode: service:network
    depends_on: {network: {condition: service_started}}
    mem_limit: 192m
    memswap_limit: 192m
    entrypoint: [/usr/local/bin/deploy_validation]
    command: [--help]
    volumes:
      - type: bind
        source: ./client
        target: /run/client
        read_only: true
        bind: {create_host_path: false}
      - validation-data:/var/lib/tidemq
  node-1:
    <<: *runtime
    network_mode: service:network
    depends_on: {bucket: {condition: service_completed_successfully}}
    entrypoint: [/usr/local/bin/tidemq]
    command: [serve, --config, /run/tidemq/node.toml]
    volumes:
      - type: bind
        source: ./run/node-1
        target: /run/tidemq
        read_only: true
        bind: {create_host_path: false}
      - data-1:/var/lib/tidemq
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "1", "http://127.0.0.1:8410/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
networks:
  console-ingress:
    driver: bridge
  private:
    driver: bridge
    internal: true
volumes:
  rustfs-data: {}
  validation-data: {}
  data-1: {}
