global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 30s
rule_files:
  - alerts/*.yml
storage:
  tsdb:
    retention:
      time: 1h
      size: 64MB
scrape_configs:
  - job_name: tidemq
    metrics_path: /metrics
    sample_limit: 20000
    body_size_limit: 4MB
    label_limit: 12
    label_name_length_limit: 64
    label_value_length_limit: 128
    static_configs:
      - targets: ["127.0.0.1:8410"]
        labels:
          deployment: local-rf1
