apiVersion: v1
kind: ServiceAccount
metadata: {name: tidemq-kube-state-metrics, namespace: kube-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: tidemq-kube-state-metrics}
rules:
  - apiGroups: ['']
    resources: [nodes, pods, persistentvolumes, persistentvolumeclaims]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: tidemq-kube-state-metrics}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tidemq-kube-state-metrics}
subjects: [{kind: ServiceAccount, name: tidemq-kube-state-metrics, namespace: kube-system}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tidemq-kube-state-metrics, namespace: kube-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: tidemq-kube-state-metrics}}
  template:
    metadata: {labels: {app: tidemq-kube-state-metrics}}
    spec:
      serviceAccountName: tidemq-kube-state-metrics
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args: ['--resources=nodes,pods,persistentvolumes,persistentvolumeclaims,deployments,statefulsets,daemonsets,storageclasses']
          ports: [{name: metrics, containerPort: 8080}, {name: telemetry, containerPort: 8081}]
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 250m, memory: 192Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
---
apiVersion: v1
kind: Service
metadata: {name: tidemq-kube-state-metrics, namespace: kube-system}
spec:
  type: NodePort
  selector: {app: tidemq-kube-state-metrics}
  ports: [{name: metrics, port: 8080, targetPort: 8080, nodePort: 30080}]
