server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
distributor:
  receivers:
    otlp:
      protocols:
        http: {endpoint: '127.0.0.1:14318'}
storage:
  trace:
    backend: local
    wal: {path: /data/wal}
    local: {path: /data/blocks}
backend_scheduler:
  provider:
    retention: {interval: 10m}
backend_worker:
  compaction: {block_retention: 48h}
usage_report: {reporting_enabled: false}
