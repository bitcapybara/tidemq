auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 3101
common:
  path_prefix: /data
  instance_addr: 127.0.0.1
  replication_factor: 1
  ring:
    kvstore: {store: inmemory}
  storage:
    filesystem: {chunks_directory: /data/chunks, rules_directory: /data/rules}
schema_config:
  configs:
    - from: '2026-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index: {prefix: index_, period: 24h}
compactor:
  working_directory: /data/compactor
  retention_enabled: true
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  ingestion_rate_mb: 2
  ingestion_burst_size_mb: 4
  max_query_parallelism: 4
  max_query_series: 1000
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.name, service.namespace, deployment.environment.name]
        - action: structured_metadata
          attributes: [service.instance.id, k8s.pod.name, k8s.namespace.name, tidemq.node.id, ci.run.id]
analytics: {reporting_enabled: false}
