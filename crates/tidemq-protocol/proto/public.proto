syntax = "proto3";
package tidemq.public.v1;
import "common.proto";

message Hello {
  bytes session_id = 1;
  tidemq.common.v1.TrafficClass traffic_class = 2;
  string access_token = 3;
}

message HelloResult {
  bytes session_id = 1;
  uint32 max_frame_bytes = 2;
  uint32 max_batch_messages = 3;
  uint64 max_in_flight_bytes = 4;
}

message CreateTopic { string name = 1; uint32 partitions = 2; }
message GetTopic { string name = 1; }
message TopicResult { bytes topic_id = 1; string name = 2; uint32 partitions = 3; }
message LogicalTopic { string name = 1; }
message GetTopicLayout { bytes topic_id = 1; }
message ShardRoute {
  bytes shard_id = 1;
  uint64 hash_start = 2;
  optional uint64 hash_end = 3;
  uint64 group_id = 4;
  uint64 authority_epoch = 5;
  uint32 birth_partition = 6;
  repeated bytes predecessors = 7;
  optional uint64 sealed_end = 8;
}
message TopicLayoutResult {
  bytes topic_id = 1;
  uint64 revision = 2;
  repeated ShardRoute active = 3;
  repeated ShardRoute history = 4;
}
message ChangeTopicLayout {
  bytes topic_id = 1;
  uint64 expected_revision = 2;
  bytes left_shard = 3;
  bytes right_shard = 4;
  optional uint64 split_at = 5;
}
enum IdentityAction {
  IDENTITY_ACTION_UNSPECIFIED = 0;
  CREATE_TENANT_IDENTITY = 1;
  CREATE_NAMESPACE_IDENTITY = 2;
  PUT_PRINCIPAL_IDENTITY = 3;
  ISSUE_CREDENTIAL = 4;
  REVOKE_CREDENTIAL = 5;
  SET_TENANT_ENABLED = 6;
}
message ManageIdentity {
  IdentityAction action = 1;
  bytes target_id = 2;
  bytes parent_id = 3;
  string name = 4;
  repeated string permissions = 5;
  uint64 lifetime_ms = 6;
  bool enabled = 7;
  bytes namespace_id = 8;
}
message IdentityResult {
  bytes id = 1;
  bytes parent_id = 2;
  optional string access_token = 3;
  uint64 expires_at_ms = 4;
  bool secret_unavailable = 5;
}
enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  PARALLEL = 1;
  KEY_SERIAL = 2;
}
message CreateSubscription {
  bytes topic_id = 1;
  string name = 2;
  uint64 start_offset = 3;
  DeliveryMode delivery_mode = 4;
}
message GetSubscription { bytes topic_id = 1; string name = 2; }
message SubscriptionResult { bytes subscription_id = 1; bytes topic_id = 2; uint64 cursor_generation = 3; }

message OpenProducer {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes producer_id = 3;
  uint64 expected_registration_epoch = 4;
  uint64 owner_epoch = 5;
}
message ProducerSessionResult {
  bytes producer_id = 1;
  uint64 producer_epoch = 2;
  uint64 next_sequence = 3;
  uint64 expires_at_ms = 4;
  uint64 next_registration_epoch = 5;
}
message ProducerStatus {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes producer_id = 3;
  uint64 producer_epoch = 4;
}
enum ProducerSessionState {
  PRODUCER_SESSION_STATE_UNSPECIFIED = 0;
  NOT_REGISTERED = 1;
  ACTIVE = 2;
  EXPIRED = 3;
}
message ProducerStatusResult {
  ProducerSessionState state = 1;
  ProducerSessionResult session = 2;
  uint64 next_registration_epoch = 3;
}
message RetireProducer {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes producer_id = 3;
  uint64 producer_epoch = 4;
  uint64 owner_epoch = 5;
}
message ProducerRetired { bytes producer_id = 1; uint64 producer_epoch = 2; bool already_retired = 3; }

message ClaimAssignment {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes subscription_id = 3;
  uint64 expected_cursor_generation = 4;
  uint64 expected_assignment_generation = 5;
  bytes session_id = 6;
  bytes replace_session_id = 7;
  optional uint64 cold_before = 8;
  uint64 owner_epoch = 9;
}
message AssignmentResult {
  bytes subscription_id = 1;
  bytes topic_id = 2;
  uint32 partition_id = 3;
  bytes session_id = 4;
  uint64 cursor_generation = 5;
  uint64 assignment_generation = 6;
  uint64 delivery_generation = 7;
  uint64 acknowledged_before = 8;
  uint64 next_delivery_offset = 9;
  uint64 cold_before = 10;
  uint64 received_before = 11;
  uint64 issued_before = 12;
}
message SubscriptionStatus { bytes topic_id = 1; uint32 partition_id = 2; bytes subscription_id = 3; }
message SubscriptionStatusResult { AssignmentResult assignment = 1; bool assigned = 2; }
message SeekSubscription {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes subscription_id = 3;
  uint64 expected_cursor_generation = 4;
  uint64 expected_assignment_generation = 5;
  uint64 target_offset = 6;
  uint64 owner_epoch = 7;
}
message SeekResult {
  uint64 cursor_generation = 1;
  uint64 assignment_generation = 2;
  uint64 delivery_generation = 3;
  uint64 acknowledged_before = 4;
}
message DeleteSubscription {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes subscription_id = 3;
  uint64 expected_cursor_generation = 4;
  uint64 expected_assignment_generation = 5;
  uint64 owner_epoch = 6;
}
message SubscriptionDeleted { bytes subscription_id = 1; bool already_deleted = 2; }

message Message { bytes key = 1; bytes body = 2; }
message ProduceBatch {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes producer_id = 3;
  uint64 producer_epoch = 4;
  uint64 first_sequence = 5;
  repeated Message messages = 6;
  bytes content_digest = 7;
  uint64 owner_epoch = 8;
}
message ProduceResult { uint64 first_offset = 1; uint32 message_count = 2; bool duplicate = 3; }
message ReadRequest {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes subscription_id = 3;
  uint64 cursor_generation = 4;
  uint64 assignment_generation = 5;
  uint32 max_messages = 6;
  uint32 max_bytes = 7;
  uint64 delivery_generation = 8;
  bytes session_id = 9;
}
message Delivery {
  uint64 offset = 1;
  bytes key = 2;
  bytes body = 3;
  bytes delivery_token = 4;
}
// Ranges contain only persisted ACK holes in the current assignment.
message AcknowledgedRange { uint64 start = 1; uint64 end = 2; }
message DeliveryBatch {
  repeated Delivery deliveries = 1;
  uint64 next_offset = 2;
  bytes topic_id = 3;
  uint32 partition_id = 4;
  bytes subscription_id = 5;
  uint64 cursor_generation = 6;
  uint64 assignment_generation = 7;
  uint64 delivery_generation = 8;
  bytes session_id = 9;
  uint64 cold_before = 10;
  uint64 issued_before = 11;
  repeated AcknowledgedRange acknowledged_ranges = 12;
}
message AckBatch {
  bytes subscription_id = 1;
  uint32 partition_id = 2;
  uint64 cursor_generation = 3;
  uint64 assignment_generation = 4;
  repeated bytes delivery_tokens = 5;
  bytes topic_id = 6;
  uint64 delivery_generation = 7;
  bytes session_id = 8;
}
message AckResult { uint64 acknowledged_before = 1; uint32 accepted = 2; uint32 already_acknowledged = 3; }
message ReceiveBarrier {
  bytes subscription_id = 1;
  uint32 partition_id = 2;
  uint64 cursor_generation = 3;
  uint64 assignment_generation = 4;
  uint64 received_before = 5;
  bytes topic_id = 6;
  uint64 delivery_generation = 7;
  bytes session_id = 8;
}
