syntax = "proto3";
package tidemq.public.v1;
import "common.proto";

message Hello {
  bytes session_id = 1;
  tidemq.common.v1.TrafficClass traffic_class = 2;
  string access_token = 3;
}

message HelloResult {
  bytes session_id = 1;
  uint32 max_frame_bytes = 2;
  uint32 max_batch_messages = 3;
  uint64 max_in_flight_bytes = 4;
}

enum ClusterAction {
  CLUSTER_ACTION_UNSPECIFIED = 0;
  REGISTER_CLUSTER_NODE = 1;
  SET_NODE_SCHEDULABLE = 2;
  CREATE_DATA_GROUP = 3;
  REPLACE_METADATA_REPLICA = 4;
  BEGIN_NODE_DRAIN = 5;
  INSPECT_NODE_DRAIN = 6;
  RETIRE_CLUSTER_NODE = 7;
  REPLACE_DATA_REPLICA = 8;
  TRANSFER_SHARD_AUTHORITY = 9;
  INSPECT_AUTHORITY_TRANSFER = 10;
}
message ClusterNode {
  uint64 node_id = 1;
  string role = 2;
  string zone = 3;
  string internal_endpoint = 4;
  string certificate_name = 5;
  bytes certificate_pin = 6;
  bool schedulable = 7;
  bool retired = 8;
  uint64 generation = 9;
  bool draining = 10;
}
message ClusterGroup { uint64 group_id = 1; uint64 generation = 2; repeated uint64 voters = 3; }
message ManageCluster {
  ClusterAction action = 1;
  ClusterNode registration = 2;
  uint64 node_id = 3;
  bool enabled = 4;
  uint64 group_id = 5;
  repeated uint64 voters = 6;
  uint64 removed_node = 7;
  uint64 added_node = 8;
  bytes shard_id = 9;
  bytes transfer_operation = 10;
}
message MetadataMembershipChange {
  bytes operation_id = 1;
  repeated uint64 previous = 2;
  repeated uint64 target = 3;
  uint64 expected_membership_index = 4;
  optional uint64 completed_membership_index = 5;
}
message ClusterControlResult { ClusterNode node = 1; ClusterGroup group = 2; MetadataMembershipChange metadata_change = 3; NodeDrainProgress drain_progress = 4; DataMembershipChange data_change = 5; AuthorityTransferInfo authority_transfer = 6; }
message AuthorityTransferInfo {
  bytes operation_id = 1;
  bytes shard_id = 2;
  bytes topic_id = 3;
  uint64 source_group = 4;
  uint64 target_group = 5;
  // Prepare, Frozen, Exported, Imported, Published, Checkpointed, Retired.
  uint32 stage = 6;
}
message DataMembershipChange {
  bytes operation_id = 1;
  uint64 group_id = 2;
  uint64 expected_generation = 3;
  repeated uint64 previous = 4;
  repeated uint64 target = 5;
  bool complete = 6;
}
message NodeDrainProgress {
  uint64 node_id = 1;
  uint32 owned_shards = 2;
  uint32 storage_groups = 3;
  uint32 pending_membership_changes = 4;
  bool metadata_voter = 5;
  bool retired = 6;
}
message GetClusterRegistry {
  optional uint64 after_node = 1;
  optional uint64 after_group = 2;
  uint64 expected_revision = 3;
}
message ClusterRegistryPage {
  uint64 revision = 1;
  repeated ClusterNode nodes = 2;
  repeated ClusterGroup groups = 3;
  optional uint64 next_node = 4;
  optional uint64 next_group = 5;
}

message GetTopic { string name = 1; }
message TopicResult { bytes topic_id = 1; string name = 2; }
message LogicalTopic { string name = 1; }
message GetTopicLayout { bytes topic_id = 1; uint64 expected_revision = 2; bytes after_shard = 3; }
message ShardRoute {
  bytes shard_id = 1;
  uint64 hash_start = 2;
  optional uint64 hash_end = 3;
  uint64 group_id = 4;
  uint64 authority_epoch = 5;
  uint32 birth_partition = 6;
  repeated bytes predecessors = 7;
  optional uint64 sealed_end = 8;
}
message TopicLayoutResult {
  bytes topic_id = 1;
  uint64 revision = 2;
  repeated ShardRoute active = 3;
  repeated ShardRoute history = 4;
  bytes next_after_shard = 5;
  uint32 total_shards = 6;
}
message ChangeTopicLayout {
  bytes topic_id = 1;
  uint64 expected_revision = 2;
  bytes left_shard = 3;
  bytes right_shard = 4;
  optional uint64 split_at = 5;
}
enum IdentityAction {
  IDENTITY_ACTION_UNSPECIFIED = 0;
  CREATE_TENANT_IDENTITY = 1;
  CREATE_NAMESPACE_IDENTITY = 2;
  PUT_PRINCIPAL_IDENTITY = 3;
  ISSUE_CREDENTIAL = 4;
  REVOKE_CREDENTIAL = 5;
  SET_TENANT_ENABLED = 6;
  SET_TENANT_LIMITS = 7;
  SET_NAMESPACE_LIMITS = 8;
  SET_PRINCIPAL_ENABLED = 9;
  DELETE_TENANT_IDENTITY = 10;
  DELETE_NAMESPACE_IDENTITY = 11;
  SET_NAMESPACE_ENABLED = 12;
}
message ResourceLimits {
  // Zero retains the current value; namespace defaults inherit their tenant's current limit.
  uint32 topics = 1;
  uint32 subscriptions = 2;
  uint32 principals = 3;
  uint32 credentials = 4;
  uint32 connections = 5;
  uint32 members = 6;
  uint64 backlog_bytes = 7;
  uint64 inflight_bytes = 8;
  uint64 inflight_messages = 9;
  uint64 publish_bytes_per_second = 10;
  uint64 consume_bytes_per_second = 11;
  uint64 cold_reads = 12;
}
message ManageIdentity {
  IdentityAction action = 1;
  bytes target_id = 2;
  bytes parent_id = 3;
  string name = 4;
  repeated string permissions = 5;
  uint64 lifetime_ms = 6;
  bool enabled = 7;
  bytes namespace_id = 8;
  ResourceLimits limits = 9;
}
message IdentityResult {
  bytes id = 1;
  bytes parent_id = 2;
  optional string access_token = 3;
  uint64 expires_at_ms = 4;
  bool secret_unavailable = 5;
  bool policy_pending = 6;
  bool policy_superseded = 7;
}
enum IdentityKind {
  IDENTITY_KIND_UNSPECIFIED = 0;
  TENANT_IDENTITIES = 1;
  NAMESPACE_IDENTITIES = 2;
  PRINCIPAL_IDENTITIES = 3;
  CREDENTIAL_IDENTITIES = 4;
}
message ListIdentities {
  IdentityKind kind = 1;
  bytes parent_id = 2;
  bytes after_id = 3;
  uint32 limit = 4;
  uint64 expected_revision = 5;
}
message IdentityInfo {
  bytes id = 1;
  bytes parent_id = 2;
  string name = 3;
  bool enabled = 4;
  bytes namespace_id = 5;
  repeated string permissions = 6;
  uint64 expires_at_ms = 7;
  ResourceLimits limits = 8;
  bool deleted = 9;
}
message IdentityPage {
  repeated IdentityInfo entries = 1;
  bytes next_after_id = 2;
  uint64 revision = 3;
}

enum ConsumerAction {
  CONSUMER_ACTION_UNSPECIFIED = 0;
  ENSURE_CONSUMER_SUBSCRIPTION = 1;
  JOIN_CONSUMER = 2;
  HEARTBEAT_CONSUMER = 3;
  LEAVE_CONSUMER = 4;
  CONSUMER_STATUS = 5;
  RETIRE_CONSUMER = 6;
}
enum ConsumerModel { CONSUMER_MODEL_UNSPECIFIED = 0; STREAM_CONSUMER = 1; QUEUE_CONSUMER = 2; }
enum SubscriptionAdminAction { SUBSCRIPTION_ADMIN_ACTION_UNSPECIFIED = 0; INSPECT_SUBSCRIPTION = 1; REMOVE_SUBSCRIPTION = 2; }
message SubscriptionAdmin {
  bytes topic_id = 1;
  bytes subscription_id = 2;
  string name = 3;
  ConsumerModel model = 4;
  SubscriptionAdminAction action = 5;
}
message SubscriptionAdminResult {
  bytes topic_id = 1;
  bytes subscription_id = 2;
  string name = 3;
  ConsumerModel model = 4;
  bool start_at_latest = 5;
  bytes deletion_operation = 6;
  uint32 deleted_domains = 7;
  uint32 total_domains = 8;
  bool deletion_complete = 9;
}
message ConsumerControl {
  bytes topic_id = 1;
  string name = 2;
  bytes subscription_id = 3;
  ConsumerModel model = 4;
  bool start_at_latest = 5;
  ConsumerAction action = 6;
  bytes member_id = 7;
  uint64 member_epoch = 8;
  uint64 heartbeat_sequence = 9;
  uint32 max_messages = 10;
  uint64 max_bytes = 11;
}
message ConsumerControlResult {
  bytes subscription_id = 1;
  uint64 next_member_epoch = 2;
  uint64 member_epoch = 3;
  uint64 expires_ms = 4;
  uint32 member_status = 5;
  bool plan_active = 6;
  repeated bytes work_shards = 7;
  repeated ConsumerLane lanes = 8;
  uint64 assignment_version = 9;
  uint64 remaining_lease_ms = 10;
  uint64 next_heartbeat_sequence = 11;
  bool assignment_fenced = 12;
  repeated uint64 lane_fences = 13;
}
message ConsumerLane { uint64 hash_start = 1; optional uint64 hash_end = 2; }
message GroupRead {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes subscription_id = 3;
  bytes member_id = 4;
  uint64 member_epoch = 5;
  uint64 sequence = 6;
  uint32 max_messages = 7;
  uint64 max_bytes = 8;
}
message GroupProof { uint64 offset = 1; uint32 attempt = 2; bytes mac = 3; }
message GroupDelivery {
  GroupProof proof = 1;
  bytes key = 2;
  bytes body = 3;
  uint64 key_hash = 4;
  bool current_attempt = 5;
  bool key_present = 6;
  map<string, bytes> properties = 7;
}
message PublishMessage { optional bytes key = 1; bytes payload = 2; map<string, bytes> properties = 3; }
enum PublisherAction { PUBLISHER_ACTION_UNSPECIFIED = 0; OPEN_PUBLISHER = 1; HEARTBEAT_PUBLISHER = 2; CLOSE_PUBLISHER = 3; PUBLISHER_STATUS = 4; }
message PublisherControl {
  bytes topic_id = 1;
  bytes producer_id = 2;
  uint64 registration = 3;
  PublisherAction action = 4;
  uint64 heartbeat_sequence = 5;
}
message PublisherControlResult {
  uint64 next_registration = 1;
  uint64 registration = 2;
  bool live = 3;
  uint64 remaining_lease_ms = 4;
  uint64 next_heartbeat_sequence = 5;
}
message Publish {
  bytes topic_id = 1;
  bytes shard_id = 2;
  uint32 partition_id = 3;
  bytes producer_id = 4;
  uint64 registration = 5;
  uint64 sequence = 6;
  bytes digest = 7;
  PublishMessage message = 8;
  uint64 retired_before = 9;
}
message PublishResult {
  bytes topic_id = 1;
  bytes shard_id = 2;
  bytes producer_id = 3;
  uint64 registration = 4;
  uint64 sequence = 5;
  bytes digest = 6;
  optional uint64 offset = 7;
  bytes permanent_seal = 8;
  uint64 sealed_end = 9;
  bool permanently_closed = 10;
}
message RetirePublishes {
  bytes topic_id = 1;
  bytes shard_id = 2;
  uint32 partition_id = 3;
  bytes producer_id = 4;
  uint64 registration = 5;
  uint64 before = 6;
  bool close = 7;
}
message PublishesRetired { uint64 before = 1; }
message GroupDeliveries { uint64 sequence = 1; repeated GroupDelivery deliveries = 2; bool sealed_complete = 3; uint64 assignment_version = 4; }
message GroupAck {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes subscription_id = 3;
  bytes member_id = 4;
  uint64 member_epoch = 5;
  uint64 sequence = 6;
  repeated GroupProof proofs = 7;
  optional uint64 nack_delay_ms = 8;
}
message GroupAckResult { bool redelivery_scheduled = 1; uint64 due_ms = 2; }
message GroupRetire {
  bytes topic_id = 1;
  uint32 partition_id = 2;
  bytes subscription_id = 3;
  bytes member_id = 4;
  uint64 member_epoch = 5;
  uint64 sequence = 6;
}
message GroupRetired {}

message RemoveTopic { bytes topic_id = 1; }
message TopicRemoved {
  bytes topic_id = 1;
  bytes deletion_operation = 2;
  uint32 sealed_domains = 3;
  uint32 total_domains = 4;
  bool complete = 5;
}
