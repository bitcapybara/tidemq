syntax = "proto3";
package tidemq.common.v1;

enum TrafficClass {
  TRAFFIC_CLASS_UNSPECIFIED = 0;
  CONTROL = 1;
  PRODUCE = 2;
  DELIVERY = 3;
  BULK = 4;
  REPLICATION = 5;
}

enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  HELLO = 1;
  HELLO_RESULT = 2;
  ERROR = 3;
  TOPIC_RESULT = 11;
  CANCEL = 26;
  GET_TOPIC = 36;
  RAFT_VOTE = 40;
  RAFT_APPEND = 41;
  RAFT_SNAPSHOT = 42;
  RAFT_RESULT = 43;
  DIAGNOSE = 50;
  DIAGNOSTIC_RESULT = 51;
  INTERNAL_COMMAND = 60;
  INTERNAL_RESULT = 61;
  GET_TOPIC_LAYOUT = 62;
  TOPIC_LAYOUT_RESULT = 63;
  CHANGE_TOPIC_LAYOUT = 64;
  CREATE_LOGICAL_TOPIC = 65;
  MANAGE_IDENTITY = 66;
  IDENTITY_RESULT = 67;
  CONSUMER_CONTROL = 68;
  CONSUMER_CONTROL_RESULT = 69;
  GROUP_READ = 70;
  GROUP_DELIVERIES = 71;
  GROUP_ACK = 72;
  GROUP_ACK_RESULT = 73;
  GROUP_RETIRE_READ = 74;
  GROUP_RETIRE_ACK = 75;
  GROUP_RETIRED = 76;
  PUBLISHER_CONTROL = 77;
  PUBLISHER_CONTROL_RESULT = 78;
  PUBLISH = 79;
  PUBLISH_RESULT = 80;
  RETIRE_PUBLISHES = 81;
  PUBLISHES_RETIRED = 82;
  SUBSCRIPTION_ADMIN = 83;
  SUBSCRIPTION_ADMIN_RESULT = 84;
  REMOVE_TOPIC = 85;
  TOPIC_REMOVED = 86;
  LIST_IDENTITIES = 87;
  IDENTITY_PAGE = 88;
  MANAGE_CLUSTER = 89;
  CLUSTER_CONTROL_RESULT = 90;
  GET_CLUSTER_REGISTRY = 91;
  CLUSTER_REGISTRY_PAGE = 92;
  CONSOLE_READ = 93;
  CONSOLE_READ_RESULT = 94;
  CONSOLE_WRITE = 95;
  CONSOLE_OPERATION_RESULT = 96;
  GET_CONSOLE_OPERATION = 97;
  GROUP_WATCH = 98;
  GROUP_WATCH_RESULT = 99;
  GROUP_WATCH_CANCEL = 100;
  GROUP_WATCH_CANCELLED = 101;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  INVALID_REQUEST = 1;
  UNAUTHENTICATED = 2;
  FORBIDDEN = 3;
  FENCED = 4;
  QUOTA_EXCEEDED = 5;
  UNAVAILABLE = 6;
  DEADLINE_EXCEEDED = 7;
  RESULT_UNKNOWN = 8;
  SEQUENCE_GAP = 9;
  CONTENT_CONFLICT = 10;
  DEDUPLICATION_EXPIRED = 11;
  STALE_DELIVERY = 12;
  OFFSET_EXPIRED = 13;
  NOT_FOUND = 14;
  INTERNAL_ERROR = 15;
  SESSION_EXPIRED = 16;
  REGISTRATION_CONFLICT = 17;
  ASSIGNMENT_BUSY = 18;
  STALE_GENERATION = 19;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  REJECTED = 1;
  COMMITTED = 2;
  UNKNOWN = 3;
}

message Frame {
  uint32 protocol_version = 1;
  bytes request_id = 2;
  bytes operation_id = 3;
  TrafficClass traffic_class = 4;
  FrameKind kind = 5;
  string traceparent = 6;
  bytes payload = 7;
  uint64 remaining_timeout_ms = 8;
}

message ErrorReply {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  Outcome outcome = 4;
  optional uint64 expected_sequence = 5;
  optional uint64 expected_registration_epoch = 6;
  optional uint64 retry_after_ms = 7;
  bool original_outcome_known = 8;
}

message CancelRequest { bytes request_id = 1; }
