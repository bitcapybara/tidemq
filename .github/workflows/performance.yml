name: Performance
on:
  # Performance measurements are scheduled manually while baseline policy is deferred.
  workflow_dispatch:

permissions:
  contents: read

env:
  # Compare both source revisions with the same explicitly selected compiler.
  RUSTUP_TOOLCHAIN: 1.99.1

concurrency:
  group: tidemq-dev
  cancel-in-progress: false

jobs:
  build:
    name: Build fixed performance binaries
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 45
    outputs:
      source_commit: ${{ steps.reference.outputs.source_commit }}
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}
    steps:
      - name: Check out protected comparison tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Read protected baseline source
        id: reference
        run: node trusted/scripts/performance-gate.mjs source --tools trusted >> "$GITHUB_OUTPUT"
      - name: Check out previous measured service
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.reference.outputs.source_commit }}
          path: baseline
          persist-credentials: false
      - name: Check out proposed service
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Validate the trusted comparator
        run: node --test trusted/scripts/performance/*.test.mjs
      - name: Build both service and SDK workload artifacts
        id: build
        env:
          REQUIRE_UNCHANGED: ${{ github.event_name == 'pull_request' && '--require-baseline-unchanged' || '' }}
        run: >-
          bash trusted/scripts/lab/with-lease.sh node trusted/scripts/performance-gate.mjs prepare
          --tools trusted --baseline baseline --candidate candidate
          --output performance-build $REQUIRE_UNCHANGED >> "$GITHUB_OUTPUT"
      - name: Transfer fixed binary artifacts to the measurement job
        uses: actions/upload-artifact@v4
        with:
          name: performance-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
          path: |
            performance-build/manifest.json
            performance-build/builds/baseline/tidemq
            performance-build/builds/candidate/tidemq
            performance-build/builds/baseline-load/perf_load
            performance-build/builds/candidate-load/perf_load
            performance-build/builds/*/identity.json
            performance-build/builds/*/build.log
      - name: Retain failed build identities and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: performance-build-failure
          if-no-files-found: warn
          retention-days: 30
          path: |
            performance-build/builds/*/identity.json
            performance-build/builds/*/build.log

  measure:
    name: Measure fixed RF1 and RF3 artifacts in the leased runner VM
    needs: build
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 55
    steps:
      - name: Check out the same protected comparison tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the protected baseline source for verification
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_commit }}
          path: baseline
          persist-credentials: false
      - name: Check out the exact proposed source for verification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: performance-build
          path: performance-build
      - name: Verify fixed builds and alternate all paired trials
        env:
          PREPARED_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
          REQUIRE_UNCHANGED: ${{ github.event_name == 'pull_request' && '--require-baseline-unchanged' || '' }}
        run: >-
          bash trusted/scripts/lab/with-lease.sh node trusted/scripts/performance-gate.mjs measure
          --tools trusted --baseline baseline --candidate candidate
          --prepared performance-build --manifest-sha256 "$PREPARED_SHA256"
          --output performance-result $REQUIRE_UNCHANGED
      - name: Upload reports, metrics and bounded process logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-comparison
          if-no-files-found: warn
          retention-days: 30
          path: |
            performance-result/summary.json
            performance-result/build-manifest.json
            performance-result/builds/*/identity.json
            performance-result/builds/*/build.log
            performance-result/rf*/*/report-*.json
            performance-result/rf*/*/execution.json
            performance-result/rf*/*/node-*-validated.json
            performance-result/rf*/*/*.log
            performance-result/rf*/*/*-metrics.txt
            performance-result/rf*/*/*-diagnostics.json

  performance:
    name: Performance gate (RF1 and RF3)
    if: always()
    needs: [build, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful fixed builds and complete measurements
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          MEASURE_RESULT: ${{ needs.measure.result }}
        run: '[[ "$BUILD_RESULT" == "success" && "$MEASURE_RESULT" == "success" ]]'

  promote-baseline:
    name: Record successful main performance and coverage baselines
    # Manual dispatch never satisfies this condition; automatic promotion is paused.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: performance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: performance-comparison
          path: measured
      - name: Promote only the validated current main source
        env:
          VALIDATED_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/promote-baselines.sh
