name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: tidemq-dev
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, tidemq-dev]
          - os: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@1.99.1
        if: runner.os == 'macOS'
        with: {components: 'rustfmt, clippy'}
      - uses: taiki-e/install-action@v2
        if: runner.os == 'macOS'
        with: {tool: 'nextest@0.9.148'}
      - run: bash scripts/ci/validate.sh
      - run: bash scripts/ci/integration.sh
        env:
          TIDEMQ_REQUIRE_EXTERNAL: ${{ runner.os == 'Linux' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: target/ci
          retention-days: 14

  lab:
    name: Kubernetes RF3 and VM faults
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: bash scripts/lab/with-lease.sh bash scripts/ci/lab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-lab
          path: target/ci/lab-report
          retention-days: 30

  coverage:
    name: Coverage baseline (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: candidate, fetch-depth: 0, persist-credentials: false}
      - run: node --test trusted/scripts/coverage/*.test.mjs
      - run: bash trusted/scripts/coverage-run.sh candidate coverage-result $COVERAGE_GATE_MODE
        env:
          CARGO_LLVM_COV_TARGET_DIR: /srv/tidemq/cargo-target/coverage
          COVERAGE_GATE_MODE: ${{ github.event_name == 'pull_request' && '--require-baseline-unchanged' || (github.ref == 'refs/heads/main' && '--allow-initialize' || '') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: coverage-report, path: coverage-result, retention-days: 30}

  untrusted:
    name: Fork unit tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@1.99.1
        with: {components: 'rustfmt, clippy'}
      - uses: taiki-e/install-action@v2
        with: {tool: 'nextest@0.9.148'}
      - run: bash scripts/ci/validate.sh

  rust:
    name: Rust gate
    if: always()
    needs: [validate, lab, coverage, untrusted]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: >-
          node -e 'const r=JSON.parse(process.env.RESULTS); const fork=process.env.FORK==="true"; if(fork ? r.untrusted.result!=="success" : ["validate","lab","coverage"].some(k=>r[k].result!=="success")) process.exit(1)'
        env:
          RESULTS: ${{ toJSON(needs) }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
