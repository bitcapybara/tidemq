name: Rust
on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Free unused Android SDK space for WAL and replica-copy headroom
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf -- /usr/local/lib/android
          df -h .
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --tests --examples --no-deps --locked -- -D warnings
      - run: cargo clippy --workspace --lib --bins --no-deps --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unimplemented -D clippy::todo -D clippy::indexing_slicing
      # Runtime tests share process-wide tracing and launch bounded Raft subprocesses.
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: cargo test --workspace --doc --locked
      - run: cargo build -p tidemq-protocol --features codegen --locked
      - run: cargo fmt --all
      - run: git diff --exit-code -- crates/tidemq-protocol/src/generated
      - run: cargo run --locked -- validate-config --config config/local.toml
      - run: cargo run --locked -- allocator-probe --blocks 2
      - name: Locate failed runtime logs
        if: failure()
        id: runtime-logs
        run: printf 'root=%s\n' "$(node -p 'require("node:os").tmpdir()')" >> "$GITHUB_OUTPUT"
      - name: Preserve failed runtime process logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-process-logs-${{ matrix.os }}
          path: ${{ steps.runtime-logs.outputs.root }}/tidemq-runtime-*/process-*.log
          if-no-files-found: ignore
          retention-days: 7

  allocator:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [allocator-system, allocator-mimalloc, allocator-jemalloc]
    steps:
      - uses: actions/checkout@v4
      - name: Free unused Android SDK space for WAL and replica-copy headroom
        run: |
          sudo rm -rf -- /usr/local/lib/android
          df -h .
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.backend }}
      - run: cargo clippy -p tidemq --tests --no-deps --locked --no-default-features --features ${{ matrix.backend }} -- -D warnings
      - run: cargo test -p tidemq --locked --no-default-features --features ${{ matrix.backend }} -- --test-threads=1
      - name: Locate failed runtime logs
        if: failure()
        id: runtime-logs
        run: printf 'root=%s\n' "$(node -p 'require("node:os").tmpdir()')" >> "$GITHUB_OUTPUT"
      - name: Preserve failed runtime process logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-process-logs-${{ matrix.backend }}
          path: ${{ steps.runtime-logs.outputs.root }}/tidemq-runtime-*/process-*.log
          if-no-files-found: ignore
          retention-days: 7

  heap-profile:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libunwind-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: heap-profile
      - run: cargo clippy -p tidemq --tests --no-deps --locked --no-default-features --features heap-profiling -- -D warnings
      - run: cargo test -p tidemq --locked --no-default-features --features heap-profiling --test heap_profile
