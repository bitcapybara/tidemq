name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: tidemq-dev
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  TIDEMQ_NEXTEST_LOG_MODE: ${{ vars.TIDEMQ_NEXTEST_LOG_MODE || 'live' }}

jobs:
  console:
    name: Console web
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: node --test ../../scripts/ci/workflow-gate.test.mjs
      - run: npx --no-install playwright install chromium
      - run: node --test tests/ci/*.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: node --test ../../scripts/console-package.test.mjs ../../deploy/console/prepare.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: console-coverage
          path: console/web/coverage
          retention-days: 14
          if-no-files-found: ignore

  console-browser:
    name: Console browser (chromium)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm run build
      - run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: console-browser-chromium
          path: |
            console/web/playwright-report
            console/web/test-results
          retention-days: 14
          if-no-files-found: ignore

  validate-linux:
    name: Validate (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Standard validation runs in the isolated container lane; faults and coverage keep the lab-native lane.
    runs-on: [self-hosted, Linux, X64, tidemq-ci-container]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: bash scripts/ci/with-cargo-cache.sh bash scripts/ci/native.sh
        env:
          TIDEMQ_COVERAGE_TARGET_DIR: /srv/tidemq/cargo-target/coverage-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-Linux
          path: |
            target/ci
            !target/ci/coverage
            !target/ci/lab-report
            !target/ci/console-server
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with: {name: console-server-linux, path: target/ci/console-server, retention-days: 3, if-no-files-found: ignore}

  console-browser-live:
    name: Console native HTTPS (chromium, ${{ matrix.topology }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate-linux]
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        topology: [combined, separated-rf1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: console-server-linux, path: target/ci/console-server}
      - run: |
          test "$(cat target/ci/console-server/source-commit.txt)" = "$GITHUB_SHA"
          sha256sum --check target/ci/console-server/binary.sha256
          chmod 0700 target/ci/console-server/tidemq
      - run: npm ci
        working-directory: console/web
      - run: npx --no-install playwright install chromium
        working-directory: console/web
      - run: npm run build
        working-directory: console/web
      - run: npm run test:e2e:live -- --project=chromium
        working-directory: console/web
        env:
          TIDEMQ_LIVE_TOPOLOGY: ${{ matrix.topology }}
          TIDEMQ_BINARY: ${{ github.workspace }}/target/ci/console-server/tidemq
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: console-browser-live-chromium-${{ matrix.topology }}
          path: target/ci/console-browser-live
          retention-days: 14
          if-no-files-found: ignore

  faults:
    name: Faults and deployed API (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: bash scripts/ci/with-cargo-cache.sh bash scripts/lab/with-lease.sh bash scripts/ci/faults.sh
        env:
          TIDEMQ_REQUIRE_EXTERNAL: '1'
          TIDEMQ_COVERAGE_TARGET_DIR: /srv/tidemq/cargo-target/coverage-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TIDEMQ_NEXTEST_IMAGE: localhost/tidemq-nextest:ubuntu2404-rust1.100.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-Linux-faults
          path: |
            target/ci
            !target/ci/lab-report
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kubernetes-lab
          path: target/ci/lab-report
          retention-days: 30
          if-no-files-found: ignore

  coverage:
    name: Coverage report gate (no test rerun)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate-linux, faults]
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/ci/with-cargo-cache.sh bash scripts/ci/coverage-report.sh
      - run: node --test trusted/scripts/coverage/*.test.mjs
      - run: |
          coverage_gate_mode=()
          if [ -n "$COVERAGE_GATE_MODE" ]; then
            coverage_gate_mode=("$COVERAGE_GATE_MODE")
          fi
          node trusted/scripts/coverage-gate.mjs compare --tools trusted --candidate . \
            --report target/ci/coverage/llvm.json --measurement target/ci/coverage/measurement.json \
            --run-id "$GITHUB_RUN_ID" --output target/ci/coverage/summary.json "${coverage_gate_mode[@]}"
        env:
          COVERAGE_GATE_MODE: ${{ github.event_name == 'pull_request' && '--require-baseline-unchanged' || (github.ref == 'refs/heads/main' && '--allow-initialize' || '') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with: {name: coverage-report, path: target/ci/coverage, retention-days: 30, if-no-files-found: ignore}
      - name: Remove local coverage inputs
        if: success()
        run: node scripts/coverage/bundle.mjs clean

  rust:
    name: Rust gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [validate-linux, faults, coverage, console, console-browser, console-browser-live]
    runs-on: [self-hosted, Linux, X64, tidemq-ci-container]
    timeout-minutes: 2
    steps:
      - run: >-
          node -e 'const r=JSON.parse(process.env.RESULTS); const required=["validate-linux","faults","coverage","console","console-browser","console-browser-live"]; if(required.some(k=>r[k].result!=="success")) process.exit(1)'
        env:
          RESULTS: ${{ toJSON(needs) }}
