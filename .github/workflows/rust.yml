name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: tidemq-dev
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  documentation:
    name: Documentation build and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run docs:build

  console:
    name: Console web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: node --test tests/ci/*.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: node --test ../../scripts/console-package.test.mjs ../../deploy/console/prepare.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: console-coverage
          path: console/web/coverage
          retention-days: 14

  console-browser:
    name: Console browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: console-browser-${{ matrix.browser }}
          path: |
            console/web/playwright-report
            console/web/test-results
          retention-days: 14

  validate:
    name: Validate (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, tidemq-dev]
          - os: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@1.99.1
        if: runner.os == 'macOS'
        with: {components: 'rustfmt, clippy'}
      - uses: taiki-e/install-action@v2
        if: runner.os == 'macOS'
        with: {tool: 'nextest@0.9.148'}
      - run: bash scripts/ci/with-cargo-cache.sh bash scripts/ci/native.sh
        if: runner.os == 'Linux'
        env:
          TIDEMQ_COVERAGE_TARGET_DIR: /srv/tidemq/cargo-target/coverage
      - run: bash scripts/ci/validate-and-integrate.sh
        if: runner.os == 'macOS'
        env:
          TIDEMQ_REQUIRE_EXTERNAL: '0'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: |
            target/ci
            !target/ci/coverage
            !target/ci/coverage-inputs
            !target/ci/lab-report
            !target/ci/console-server
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && runner.os == 'Linux'
        with: {name: coverage-inputs-native, path: target/ci/coverage-inputs, compression-level: 6, retention-days: 3}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() && runner.os == 'Linux'
        with: {name: console-server-linux, path: target/ci/console-server, retention-days: 3}

  console-browser-live:
    name: Console native HTTPS (${{ matrix.browser }}, ${{ matrix.topology }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        topology: [combined, separated-rf1]
        browser: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: console-server-linux, path: target/ci/console-server}
      - run: |
          test "$(cat target/ci/console-server/source-commit.txt)" = "$GITHUB_SHA"
          sha256sum --check target/ci/console-server/binary.sha256
          chmod 0700 target/ci/console-server/tidemq
      - run: npm ci
        working-directory: console/web
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
        working-directory: console/web
      - run: npm run build
        working-directory: console/web
      - run: npm run test:e2e:live -- --project=${{ matrix.browser }}
        working-directory: console/web
        env:
          TIDEMQ_LIVE_TOPOLOGY: ${{ matrix.topology }}
          TIDEMQ_BINARY: ${{ github.workspace }}/target/ci/console-server/tidemq
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: console-browser-live-${{ matrix.browser }}-${{ matrix.topology }}
          path: target/ci/console-browser-live
          retention-days: 14

  faults:
    name: Faults and deployed API (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: bash scripts/ci/with-cargo-cache.sh bash scripts/lab/with-lease.sh bash scripts/ci/faults.sh
        env:
          TIDEMQ_REQUIRE_EXTERNAL: '1'
          TIDEMQ_COVERAGE_TARGET_DIR: /srv/tidemq/cargo-target/coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-Linux-faults
          path: |
            target/ci
            !target/ci/coverage-inputs
            !target/ci/lab-report
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with: {name: coverage-inputs-lab, path: target/ci/coverage-inputs, compression-level: 6, retention-days: 3}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kubernetes-lab
          path: target/ci/lab-report
          retention-days: 30

  coverage:
    name: Coverage report gate (no test rerun)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate, faults]
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: coverage-inputs-*, path: coverage-inputs}
      - run: bash scripts/ci/with-cargo-cache.sh bash scripts/ci/coverage-report.sh
      - run: node --test trusted/scripts/coverage/*.test.mjs
      - run: >-
          node trusted/scripts/coverage-gate.mjs compare --tools trusted --candidate .
          --report target/ci/coverage/llvm.json --measurement target/ci/coverage/measurement.json
          --run-id "$GITHUB_RUN_ID" --output target/ci/coverage/summary.json $COVERAGE_GATE_MODE
        env:
          COVERAGE_GATE_MODE: ${{ github.event_name == 'pull_request' && '--require-baseline-unchanged' || (github.ref == 'refs/heads/main' && '--allow-initialize' || '') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: coverage-report, path: target/ci/coverage, retention-days: 30}

  untrusted:
    name: Fork unit tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@1.99.1
        with: {components: 'rustfmt, clippy'}
      - uses: taiki-e/install-action@v2
        with: {tool: 'nextest@0.9.148'}
      - run: bash scripts/ci/validate.sh

  rust:
    name: Rust gate
    if: always()
    needs: [validate, faults, coverage, untrusted, console, console-browser, console-browser-live, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: >-
          node -e 'const r=JSON.parse(process.env.RESULTS); const fork=process.env.FORK==="true"; const required=fork?["untrusted","console","console-browser","documentation"]:["validate","faults","coverage","console","console-browser","console-browser-live","documentation"]; if(required.some(k=>r[k].result!=="success")) process.exit(1)'
        env:
          RESULTS: ${{ toJSON(needs) }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
