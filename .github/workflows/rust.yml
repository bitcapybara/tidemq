name: Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: tidemq-dev
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, tidemq-dev]
          - os: macOS
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@1.99.1
        if: runner.os == 'macOS'
        with: {components: 'rustfmt, clippy'}
      - uses: taiki-e/install-action@v2
        if: runner.os == 'macOS'
        with: {tool: 'nextest@0.9.148'}
      - run: bash scripts/lab/with-lease.sh bash scripts/ci/validate-and-integrate.sh
        if: runner.os == 'Linux'
        env:
          TIDEMQ_REQUIRE_EXTERNAL: '1'
          TIDEMQ_COVERAGE: '1'
          TIDEMQ_COVERAGE_TARGET_DIR: /srv/tidemq/cargo-target/coverage
      - run: bash scripts/ci/validate-and-integrate.sh
        if: runner.os == 'macOS'
        env:
          TIDEMQ_REQUIRE_EXTERNAL: '0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: |
            target/ci
            !target/ci/coverage
            !target/ci/lab-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success() && runner.os == 'Linux'
        with: {name: coverage-report, path: target/ci/coverage, retention-days: 30}

      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: kubernetes-lab
          path: target/ci/lab-report
          retention-days: 30

  coverage:
    name: Coverage report gate (no test rerun)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: [self-hosted, Linux, X64, tidemq-dev]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: candidate, fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: coverage-report, path: coverage-result}
      - run: node --test trusted/scripts/coverage/*.test.mjs
      - run: >-
          node trusted/scripts/coverage-gate.mjs compare --tools trusted --candidate candidate
          --report coverage-result/llvm.json --measurement coverage-result/measurement.json
          --run-id "$GITHUB_RUN_ID" --output coverage-result/summary.json $COVERAGE_GATE_MODE
        env:
          COVERAGE_GATE_MODE: ${{ github.event_name == 'pull_request' && '--require-baseline-unchanged' || (github.ref == 'refs/heads/main' && '--allow-initialize' || '') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: coverage-gate, path: coverage-result/summary.json, retention-days: 30}

  untrusted:
    name: Fork unit tests
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@1.99.1
        with: {components: 'rustfmt, clippy'}
      - uses: taiki-e/install-action@v2
        with: {tool: 'nextest@0.9.148'}
      - run: bash scripts/ci/validate.sh

  rust:
    name: Rust gate
    if: always()
    needs: [validate, coverage, untrusted]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: >-
          node -e 'const r=JSON.parse(process.env.RESULTS); const fork=process.env.FORK==="true"; if(fork ? r.untrusted.result!=="success" : ["validate","coverage"].some(k=>r[k].result!=="success")) process.exit(1)'
        env:
          RESULTS: ${{ toJSON(needs) }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
