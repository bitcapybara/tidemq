[package]
name = "tidemq-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust client facilities for the TideMQ QUIC protocol."
readme = "README.md"

[dependencies]
tidemq-protocol.workspace = true
tidemq-transport.workspace = true
bytes.workspace = true
prost.workspace = true
tokio.workspace = true
tokio-util.workspace = true
snafu.workspace = true
tracing.workspace = true
opentelemetry = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
prometheus-client = { workspace = true, optional = true }

[features]
default = []
metrics = ["dep:prometheus-client"]
opentelemetry = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dev-dependencies]
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["metrics", "testing"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["pem", "aws_lc_rs"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

[lints.rust]
unsafe_code = "forbid"
